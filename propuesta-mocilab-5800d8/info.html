<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">

<title>Ayuda · MOCILAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body data-page="info">
<main id="main" class="px">
  <div class="ih"><span class="lbl soft">Mocilab</span><h1 id="iT"></h1></div>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <div class="doc" id="doc"></div>
</main>

<template id="t-nosotros">
  <p style="font-size:20px;font-weight:500">Donde el diseño juega al ritmo de la grada.</p>
  <div class="grid4">
    <div><b>Diseño premium</b>Ideado y diseñado en España.</div>
    <div><b>Calidad probada</b>Materiales de primera y corte láser de precisión.</div>
    <div><b>Pasión y experiencia</b>Piezas que conectan a cada fan con su equipo.</div>
    <div><b>Coleccionables</b>Objetos que van más allá del producto.</div>
  </div>
  <p>En <b>MOCILAB</b> vivimos el fútbol como cualquier aficionado. Diseñamos piezas para acompañar momentos, rituales y emociones que solo el deporte sabe crear. Nuestra misión: <b>convertir la pasión en experiencias reales</b> y acercar a cada fan a su equipo, sus ídolos, su historia y su estadio.</p>
  <h2>Una historia hecha por ti</h2>
  <p>Detrás de MOCILAB está <b>Fran</b>, fundador y alma creativa del proyecto. Aficionado antes que diseñador, inconformista y obsesionado con el detalle y los materiales.</p>
  <p>Diseñamos desde España con un equipo repartido entre Madrid, Barcelona y Málaga. Trabajamos con algunos de los clubes más grandes del mundo, como el Real Madrid y el FC Barcelona, creando productos oficiales que respetan su historia.</p>
  <a class="btn k" href="index.html#tienda" style="margin-top:16px">Ver la colección</a>
</template>

<template id="t-contacto">
  <p>Cuéntanos qué necesitas y te respondemos lo antes posible. Todas las consultas se atienden desde este formulario.</p>
  <form class="form" id="cf">
    <fieldset><legend>¿Quién eres?</legend>
      <label><input type="radio" name="tipo" value="fan" checked> Aficionado / tengo un pedido</label>
      <label><input type="radio" name="tipo" value="b2b"> Empresa / quiero colaborar</label>
    </fieldset>
    <div class="two">
      <label>Nombre<input name="nombre" autocomplete="name" required></label>
      <label>Email<input type="email" name="email" autocomplete="email" spellcheck="false" required></label>
    </div>
    <label>Motivo<select name="motivo"><option>Estado del pedido</option><option>Problema con mi pedido</option><option>Devolución o cambio</option><option>Pregunta sobre un producto</option><option>Colaboración, licencias o mayorista</option><option>Otro</option></select></label>
    <label>Mensaje<textarea name="mensaje" required></textarea></label>
    <button class="btn k" style="justify-self:start">Enviar mensaje</button>
  </form>
</template>

<template id="t-envios">
  <div class="grid4">
    <div><b>24-72 h</b>Entrega en la Península.</div>
    <div><b>Gratis desde 40&nbsp;€</b>Península española y portuguesa.</div>
    <div><b>14 días</b>Para devolver, con el producto sin abrir.</div>
    <div><b>+60 países</b>El coste se ve antes de pagar.</div>
  </div>
  <h2>Envíos</h2>
  <ul>
    <li><b>España y Portugal peninsular, Canarias:</b> 1 a 3 días laborables.</li>
    <li><b>Baleares:</b> 3 a 5 días. <b>Ceuta, Melilla y Andorra:</b> 2 a 4 días.</li>
    <li><b>Unión Europea y Reino Unido:</b> 5 a 7 días.</li>
    <li><b>Suiza, Noruega y resto de Europa:</b> 7 a 9 días.</li>
  </ul>
  <p>Fuera de la UE puede haber impuestos y retrasos de aduana. Si el paquete llega dañado, recházalo en la entrega e indícaselo al transportista.</p>
  <h2>Devoluciones</h2>
  <p>Puedes devolver tu pedido en los 14 días siguientes a recibirlo. El producto debe estar sin usar y en su embalaje original (los sobres o packs abiertos no se aceptan por cambio de opinión).</p>
  <p>Gestionamos la recogida y descontamos el coste de devolución de tu zona; si el producto llegó defectuoso o equivocado, no pagas nada. El reembolso se hace en un máximo de 5 días laborables por el mismo método de pago.</p>
  <a class="btn k" href="info.html?p=contacto" style="margin-top:16px">Solicitar una devolución</a>
</template>

<template id="t-faq">
  <h2>Producto</h2>
  <details><summary>¿Las monedas son oficiales?</summary><div>Sí. Todas tienen licencia oficial, con diseños exclusivos y acabados premium.</div></details>
  <details><summary>¿De qué material son las monedas?</summary><div>De aleación de zinc con un baño galvánico que da un acabado brillante, resistente y duradero.</div></details>
  <details><summary>¿Qué diferencia hay entre los blocs y los cuadernos 3D?</summary><div>En los cuadernos 3D cada hoja está cortada con láser de CO₂ y, al usarlo, aparece la figura en 3D del estadio o del escudo. En los blocs, la maqueta del estadio aparece a medida que arrancas las hojas.</div></details>
  <details><summary>¿Cómo viene presentado cada producto?</summary><div>Monedas: cápsula acrílica en blíster de cartón. Blocs 3D: caja de cartón premium. Cuadernos 3D: caja rígida con ventana.</div></details>
  <h2>Pedidos y pago</h2>
  <details><summary>¿Necesito crear una cuenta?</summary><div>No, puedes comprar como invitado. Con cuenta guardas tus datos y sigues tus pedidos más fácilmente.</div></details>
  <details><summary>¿Puedo cambiar o cancelar mi pedido?</summary><div>Sí, mientras no se haya preparado ni enviado. Escríbenos cuanto antes desde el formulario de contacto.</div></details>
  <details><summary>¿Qué métodos de pago aceptáis?</summary><div>Tarjeta (Visa, Mastercard, American Express), Apple Pay, Google Pay y PayPal.</div></details>
  <h2>Envíos y devoluciones</h2>
  <details><summary>¿Cuánto tarda mi pedido?</summary><div>De 1 a 3 días laborables en la Península. Consulta el resto de destinos en <a href="info.html?p=envios" style="text-decoration:underline">Envíos y devoluciones</a>.</div></details>
  <details><summary>¿Y si mi pedido no avanza?</summary><div>Si el seguimiento no se mueve en 7 días, escríbenos y lo resolvemos con el transportista; si no aparece, lo reenviamos o te devolvemos el dinero.</div></details>
  <details><summary>Me falta un producto o ha llegado dañado</summary><div>Escríbenos con fotos del producto y del embalaje: en 3 días si falta algo o es incorrecto, y en 15 días si tiene un defecto.</div></details>
  <details><summary>¿Cómo devuelvo un artículo?</summary><div>Tienes 14 días desde que lo recibes, con el producto sin abrir. Empieza la devolución desde el formulario de contacto eligiendo «Devolución o cambio».</div></details>
  <h2>Facturas</h2>
  <details><summary>¿Cómo pido mi factura?</summary><div>En los 15 días siguientes a la entrega, con tu nombre o empresa, NIF/CIF, dirección de facturación y número de pedido.</div></details>
  <p style="margin-top:32px">¿No encuentras tu respuesta? <a href="info.html?p=contacto" style="text-decoration:underline">Escríbenos</a>.</p>
</template>

<script src="data.js?v=10"></script>
<script src="comun.js?v=10"></script>
<script>
const SEC=[['nosotros','Quiénes somos','De fans,<br><span class="out">para fans.</span>'],['contacto','Contacto','Hablemos'],['envios','Envíos y devoluciones','Envíos y <span class="out">devoluciones</span>'],['faq','Preguntas frecuentes','Preguntas <span class="out">frecuentes</span>']];
function show(k){
  const s=SEC.find(x=>x[0]===k)||SEC[0];
  document.title=`${s[1]} · MOCILAB`;
  $('#iT').innerHTML=s[2];
  $('#tabs').innerHTML=SEC.map(([id,n])=>`<a class="pill" href="info.html?p=${id}" data-p="${id}" ${id===s[0]?'aria-current="page" aria-pressed="true"':''}>${n}</a>`).join('');
  const a=$('#tabs [aria-current]');$('#tabs').scrollLeft=a.offsetLeft-24;
  $('#doc').replaceChildren($('#t-'+s[0]).content.cloneNode(true));
  const f=$('#cf');if(f)f.onsubmit=e=>{e.preventDefault();toast('¡Gracias! Te responderemos pronto');f.reset()};
}
window.pageClick=(e,t)=>{if(t.dataset.p){e.preventDefault();history.pushState(null,'',t.href);show(t.dataset.p);scrollTo(0,0)}};
addEventListener('popstate',()=>show(new URLSearchParams(location.search).get('p')));
show(new URLSearchParams(location.search).get('p'));
</script>
</body>
</html>
